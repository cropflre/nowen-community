name: NOWEN Community Manual Release
on:
  workflow_dispatch:
    inputs:
      action:
        description: Choose read-only preflight or internal deployment
        required: true
        type: choice
        options: [preflight, deploy-inert-worker]
        default: preflight
permissions:
  contents: read
concurrency:
  group: community-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Read-only remote prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release-preflight.mjs
  deploy:
    needs: verify
    if: inputs.action == 'deploy-inert-worker'
    environment: community-internal-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Require explicit manual environment unlock
        env:
          RELEASE_UNLOCK: ${{ secrets.COMMUNITY_RELEASE_UNLOCK }}
          PEPPER: ${{ secrets.COMMUNITY_PASSWORD_PEPPER }}
          SECRET_KEY: ${{ secrets.COMMUNITY_TURNSTILE_SECRET_KEY }}
        run: |
          test "$RELEASE_UNLOCK" = "INTERNAL_UNROUTED_WORKER_ONLY"
          test -n "$SECRET_KEY"
          test ${#PEPPER} -ge 43
      - run: npm run build
      - name: Publish un-routed Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set private Turnstile server-side secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TS_SECRET: ${{ secrets.COMMUNITY_TURNSTILE_SECRET_KEY }}
        run: |
          printf '%s' "$TS_SECRET" | npx wrangler secret put TURNSTILE_SECRET_KEY
      - name: Set production password pepper (private Worker secret)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PEPPER: ${{ secrets.COMMUNITY_PASSWORD_PEPPER }}
        run: |
          printf '%s' "$PEPPER" | npx wrangler secret put PASSWORD_PEPPER
      - name: Confirm no public route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release-preflight.mjs
