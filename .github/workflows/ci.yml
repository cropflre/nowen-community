name: NOWEN Community checks
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify isolated staging build cannot target production
        env:
          CLOUDFLARE_ENV: staging
        run: |
          npm run build
          node scripts/assert-staging-build.mjs
      - name: Initialize isolated local D1
        run: |
          npx wrangler d1 migrations apply nowen-community-db --local
          node scripts/phase2-smoke.mjs --seed
          node scripts/phase3-smoke.mjs --seed
      - name: Live Worker + D1 API integration smoke
        run: |
          printf 'LOCAL_TEST_TURNSTILE=1\n' > .dev.vars
          npm run dev -- --host 127.0.0.1 > /tmp/nowen-community-dev.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5173/api/health > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/nowen-community-dev.log; exit 1; fi
          node --input-type=module -e '
            import assert from "node:assert/strict";
            const base="http://127.0.0.1:5173";
            const health=await (await fetch(base+"/api/health")).json();
            assert.equal(health.ok,true);
            const categories=await (await fetch(base+"/api/v1/categories")).json();
            assert.equal(categories.items.length,6);
            const feed=await (await fetch(base+"/api/v1/topics")).json();
            assert.deepEqual(feed.items,[]);
            const denied=await fetch(base+"/api/v1/topics",{method:"POST"});
            assert.notEqual(denied.status,200);
            console.log("Live Hono + D1 API smoke passed");
          '
          node scripts/phase2-smoke.mjs
          node scripts/phase3-smoke.mjs
      - name: Protect existing NOWEN services
        run: |
          grep -q '"workers_dev": false' wrangler.jsonc
          ! grep -q '"database_name": "nowen-site-stats"' wrangler.jsonc
